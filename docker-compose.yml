services:
  english-review:
    build: .
    container_name: english-review
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      TZ: Asia/Shanghai
      COOKIE_SECURE: "false"
      API_TOKEN: ${API_TOKEN:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-*}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-10000}
      AI_RATE_LIMIT_PER_MINUTE: ${AI_RATE_LIMIT_PER_MINUTE:-20}
    volumes:
      - ./server/data:/app/server/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
